---
# Automatically build and publish

name: Publish images

# yamllint disable-line rule:truthy
on:
  push:
    tags: ['v[0-9]+**']
  workflow_dispatch:

jobs:
  deploy-ghcr:
    name: Deploy to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build and push
        uses: docker/bake-action@v7
        with:
          source: ./images
          files: docker-bake.hcl
          targets: default
          push: true
        env:
          REGISTRY: ghcr.io
          PREFIX: jataware/beakerhub
          EXTRA_TAGS: ${{ github.ref_name }}

  deploy-ecr:
    name: Deploy ${{ matrix.image }} to ECR Public
    needs: deploy-ghcr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
      GHCR_REPOSITORY_PREFIX: ghcr.io/jataware/beakerhub
    strategy:
      fail-fast: false
      matrix:
        image:
          - server
          - proxy
          - default-node
          - task-reporter
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Log in to ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Push image to ECR Public
        env:
          IMAGE: ${{ matrix.image }}
          VERSION_TAG: ${{ github.ref_name }}
          EXTRA_TAGS: latest
        run: |
          for tag in "${VERSION_TAG}" ${EXTRA_TAGS}; do
            source_image="${GHCR_REPOSITORY_PREFIX}/${IMAGE}:${tag}"
            docker pull "${source_image}"
            destination_image="${ECR_REPOSITORY_PREFIX}/${IMAGE}:${tag}"
            docker tag "${source_image}" "${destination_image}"
            docker push "${destination_image}"
          done
