# Integration Tests Workflow
#
# This workflow runs integration tests against a BeakerHub instance
# deployed in a kind (Kubernetes in Docker) cluster.
#
# TO ENABLE: Uncomment the 'push' trigger below.
# Note: Integration tests are resource-intensive and typically run
# on merge to main or on a schedule, not on every PR.

name: Integration Tests

on:
  # Uncomment to enable on push to main:
  # push:
  #   branches: [main]

  # Uncomment to run on a schedule (e.g., nightly):
  # schedule:
  #   - cron: '0 2 * * *'  # 2 AM UTC daily

  # Manual trigger for testing the workflow
  workflow_dispatch:

env:
  CLUSTER_NAME: beakerhub-test
  REGISTRY_NAME: beaker-local-registry

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install hatch uv

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Create local registry
      #   run: |
      #     docker run -d \
      #       -p 5000:5000 \
      #       --name ${{ env.REGISTRY_NAME }} \
      #       --restart=always \
      #       registry:2

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # - name: Create kind cluster
      #   run: |
      #     cat <<EOF | kind create cluster --name ${{ env.CLUSTER_NAME }} --config=-
      #     kind: Cluster
      #     apiVersion: kind.x-k8s.io/v1alpha4
      #     containerdConfigPatches:
      #     - |-
      #       [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      #         endpoint = ["http://${{ env.REGISTRY_NAME }}:5000"]
      #     EOF

      # - name: Connect registry to kind network
      #   run: |
      #     docker network connect kind ${{ env.REGISTRY_NAME }} || true

      # - name: Build and push images to local registry
      #   run: |
      #     make build-dev-images
      #   env:
      #     REGISTRY_URL: localhost:5000

      # - name: Deploy BeakerHub via Helm
      #   run: |
      #     helm upgrade --install beakerhub-test \
      #       kubernetes/helm-charts/beakerhub \
      #       -n beakerhub \
      #       --create-namespace \
      #       -f kubernetes/values-local.yaml \
      #       --wait \
      #       --timeout 10m

      # - name: Wait for deployment
      #   run: |
      #     kubectl wait --for=condition=available deployment/hub -n beakerhub --timeout=300s
      #     kubectl wait --for=condition=available deployment/proxy -n beakerhub --timeout=300s

      - name: Run integration tests
        run: hatch run test:integration
          # # Start port-forward in background
          # kubectl port-forward -n beakerhub svc/proxy-public 8888:80 &
          # sleep 5

          # # Run tests
          # python -m pytest tests/integration -v --tb=short
        env:
          KEEP_TEST_CLUSTER: "1"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Hub Logs ==="
          kubectl logs -n beakerhub deployment/hub --tail=100 || true
          echo "=== Proxy Logs ==="
          kubectl logs -n beakerhub deployment/proxy --tail=100 || true
          echo "=== Pod Status ==="
          kubectl get pods -n beakerhub -o wide || true
          echo "=== Events ==="
          kubectl get events -n beakerhub --sort-by='.lastTimestamp' | tail -50 || true

      - name: Delete kind cluster
        if: always()
        run: |
          kind delete cluster --name ${{ env.CLUSTER_NAME }} || true
