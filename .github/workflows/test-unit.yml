# Unit Tests Workflow
#
# This workflow runs Python and Vue unit tests on PRs and pushes to main.
#
# TO ENABLE: Uncomment the 'push' and 'pull_request' triggers below.

name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ dev, main ]
  # Allow this workflow to be invoked by other workflows (e.g. the release
  # flow calls it as an inline fallback when a commit has not yet been tested).
  workflow_call:
  # Manual trigger for testing the workflow
  workflow_dispatch:

jobs:
  python-unit-tests:
    name: Python Unit Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v5
    - name: python-setup
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: install-dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch uv
    # One interpreter per job, so run the default hatch env's test script.
    - name: Run unit tests
      run: hatch run test:unit

  vue-tests:
    timeout-minutes: 30
    name: Vue Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm i
    - name: Run unit tests
      run: npm run test:unit -- --run
