{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.proxy.serviceName }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
{{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
  - secretName: {{ .secretName }}
    hosts:
    {{- range .hosts }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
  rules:
  - host: {{ .Values.ingress.hosts.proxy }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.proxy.serviceName }}
            port:
              number: {{ .Values.proxy.service.port }}
  - host: "*.{{ .Values.ingress.hosts.proxy }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.proxy.serviceName }}
            port:
              number: {{ .Values.proxy.service.port }}

{{- if .Values.dev.viteServer.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beakerhub-vite-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "beakerhub-vite"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.hosts.vite }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beakerhub-vite
            port:
              number: {{ .Values.dev.viteServer.port }}
{{- end }}
{{- end }}
