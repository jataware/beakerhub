[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beakerhub"
dynamic = ["version"]
description = "Multi-user Beaker Notebook environment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["JupyterHub", "Jupyter", "Notebook", "Agents", "LLM", "LLMs", "AI", "data-science"]
authors = [
  { name = "Matthew Printz", email = "matt@jataware.com" },
  { name = "Brandon Rose", email = "brandon@jataware.com" },
  { name = "Joel Quiles", email = "joel@jataware.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "beaker-notebook>=2.0.0",
  "boto3>=1.10",
  "click>=8.0",
  "cryptography>=41.0",
  "jupyterhub>=5.3,<6",
  "oauthenticator>=16.0",
  "jupyterhub-kubespawner",
  "pycurl",
  "kubernetes",
]

[project.scripts]
beakerhub = "beakerhub:main"

[project.urls]
Homepage = "https://github.com/jataware/beakerhub"
Documentation = "https://github.com/jataware/beakerhub#readme"
Issues = "https://github.com/jataware/beakerhub/issues"
Source = "https://github.com/jataware/beakerhub"

[tool.hatch.version]
path = "src/beakerhub/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/beakerhub"]
artifacts = [
  "src/beakerhub/ui/**",
]

[tool.hatch.build.targets.sdist]
artifacts = [
  "src/beakerhub/ui/**",
]

[project.entry-points."jupyter_client.kernel_provisioners"]
kubernetes-local-provisioner = "beakerhub.spawner.provisioner:KubernetesLocalProvisioner"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/beakerhub tests}"

[tool.hatch.envs.test]
extra-dependencies = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
  "pytest-mock>=3.10.0",
  "moto[cognitoidp]>=5.0.0",
  "requests>=2.28.0",
]
[tool.hatch.envs.test.scripts]
unit = "pytest tests/unit {args}"
integration = "pytest tests/integration {args}"
all = "pytest tests {args}"
cov = "pytest tests/unit --cov=src/beakerhub --cov-report=term-missing {args}"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source_pkgs = ["beakerhub", "tests"]
branch = true
parallel = true
omit = [
  "src/beakerhub/__about__.py",
]

[tool.coverage.paths]
beakerhub = ["src/beakerhub", "*/src/beakerhub"]
tests = ["tests", "*/beakerhub/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.default]
dependencies = [
  "bump-my-version",
  "coverage[toml]>=6.5",
  "pytest",
  "pytest-asyncio",
]

[tool.bumpversion]
current_version = "0.0.2"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)((?P<release>[ab])(?P<revision>\\d+))?"
serialize = [
  "{major}.{minor}.{patch}{release}{revision}",
  "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = true
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[tool.bumpversion.parts.release]
values = [
  "a",
  "b",
]

[[tool.bumpversion.files]]
filename = "src/beakerhub/__about__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "helm/beakerhub/Chart.yaml"
search = 'appVersion: "{current_version}"'
replace = 'appVersion: "{new_version}"'
